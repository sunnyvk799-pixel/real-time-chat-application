
name: Chat Application CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chat_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chat_app_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/chat_app_dev
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/chat_app_test
      JWT_SECRET_KEY: ci-only-test-secret-not-for-production-123456789

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify CI environment
        run: |
          python -c "import os; print('DATABASE_URL set:', bool(os.getenv('DATABASE_URL')))"
          python -c "import os; print('TEST_DATABASE_URL set:', bool(os.getenv('TEST_DATABASE_URL')))"
          python -c "import os; print('JWT_SECRET_KEY set:', bool(os.getenv('JWT_SECRET_KEY')))"

      - name: Run backend tests
        run: python -m pytest tests -v

  frontend-checks:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build
